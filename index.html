
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindIt México</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf7f9;
      color: #302638;
      margin: 0;
      text-align: center;
    }
    header {
      background: #302638;
      color: white;
      padding: 45px 20px;
    }
    h1 { font-size: 48px; margin: 0; }
    .accent { color: #e9b4d3; }
    main { padding: 35px 20px; }
    .upload {
      background: white;
      border: 2px dashed #cda5c3;
      border-radius: 18px;
      padding: 35px 15px;
      max-width: 450px;
      margin: 25px auto;
    }
    input { max-width: 100%; }
    img {
      max-width: 100%;
      max-height: 300px;
      margin-top: 20px;
      border-radius: 12px;
    }
    .categories {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      background: #302638;
      color: white;
      border: 0;
      border-radius: 20px;
      padding: 12px 22px;
      cursor: pointer;
    }
    #status { margin-top: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>findit<span class="accent">.</span></h1>
    <p>Lo viste. Lo amaste. Encuéntralo por menos.</p>
  </header>

  <main>
    <h2>Encuentra tu próximo favorito</h2>
    <p>Sube una foto de ropa, zapatos o bolsas.</p>

    <div class="upload">
      <h3>📸 Sube tu foto</h3>
      <input type="file" id="photo" accept="image/*">
      <div>
        <img id="preview" alt="Tu imagen" hidden>
      </div>
    </div>

    <h3>¿Qué estás buscando?</h3>
    <div class="categories">
      <button onclick="choose('Ropa')">Ropa</button>
      <button onclick="choose('Zapatos')">Zapatos</button>
      <button onclick="choose('Bolsas')">Bolsas</button>
    </div>

    <p id="status">Selecciona una categoría.</p>
    <p><small>Versión de prueba. Aún no busca productos.</small></p>
  </main>

  <script>
    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");

    photo.addEventListener("change", () => {
      const file = photo.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
    });

    let categoriaSeleccionada = "";

function choose(category) {
  categoriaSeleccionada = category;

  document.getElementById("status").textContent =
    "Categoría seleccionada: " + category;
}
  </script>

<div style="text-align:center; margin:30px 0;">
  <button onclick="buscarProductos()" style="
    background:#302638;
    color:white;
    border:none;
    border-radius:30px;
    padding:16px 30px;
    font-size:16px;
    cursor:pointer;">
    🔎 Buscar productos similares
  </button>
</div>

<div id="resultados" style="text-align:center; padding:20px;">
</div>

<script>
function buscarProductos() {
  const resultados = document.getElementById("resultados");

  resultados.innerHTML =
    "<h2>Próximamente 💗</h2><p>Estamos preparando tus resultados.</p>";

  resultados.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}
</script>

</body>
</html>
